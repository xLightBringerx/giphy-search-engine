<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GifHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>GifHub</h2>
    <div class="topbar">
        <button id="searchBtn">Search</button>
        <button id="trendingBtn">Trending</button>

    </div>

    <br>

    <h1 id="Header">The Reactions You Want. The Reactions You Need.</h1>
    <h3>Gifs Sourced Directly From Giphy</h3>
    <input type="text"
            id="searchInput"
            placeholder="Search for a GIF...">

    <br>

    <img src="Magnifying Glass Icon.png" alt="Magnifying Glass Icon" height="70" width="70">
    <h4>Enter a keyword to find your perfect reaction!</h4>

    <br>
    
    <a href="https://giphy.com/" target="_blank">Visit Giphy</a>
    

    <script src="main.js"></script>
</body>
</html>
